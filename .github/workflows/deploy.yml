# This is a basic workflow to help you get started with Actions

name: Build and Deploy
permissions:
  contents: read

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  deploy:
    # The type of runner that the job will run on
    runs-on: self-hosted

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        uses: pnpm/setup@v2
        with:
          cache: true
          install: true

      - name: Core file obfuscate
        run: pnpm run obfuscate

      # Runs a set of commands using the runners shell
      - name: Build project
        run: pnpm run build

      - name: Prepare deployment artifact
        run: |
          pnpm --filter=urlate deploy ./deploy
          cp ./src/i18n.js ./dist/
          cp -r dist ./deploy/

      - name: Rsync to Production
        run: |
          rsync -azq --delete \
            --exclude='.git/' \
            --exclude='config/config.json' \
            --exclude='logs/' \
            $GITHUB_WORKSPACE/deploy/ URLATE-PRODUCTION:${{secrets.DEPLOY_TARGET}}/

      - name: Restart
        run: |
          ssh URLATE-PRODUCTION \
            "cd '${{secrets.DEPLOY_TARGET}}' && pm2 startOrReload ecosystem.config.js --update-env"
