name: Build and Deploy
permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        uses: pnpm/setup@v2
        with:
          install: true

      - name: Core file minify
        run: pnpm run minify

      - name: Build project
        run: pnpm run build

      - name: Prepare deployment artifact
        run: |
          cp ./src/i18n.js ./dist/
          pnpm --filter=urlate deploy --prod ./deploy

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/URLATE.key
          chmod 600 ~/.ssh/URLATE.key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf '%s\n' \
            "Host URLATE-PRODUCTION" \
            "  HostName ${{ secrets.DEPLOY_HOST }}" \
            "  User ${{ secrets.DEPLOY_USER }}" \
            "  IdentityFile ~/.ssh/URLATE.key" \
            "  IdentitiesOnly yes" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Rsync to Production
        run: |
          rsync -azq --delete \
            --exclude='.git/' \
            --exclude='config/config.json' \
            --exclude='logs/' \
            $GITHUB_WORKSPACE/deploy/ URLATE-PRODUCTION:${{secrets.DEPLOY_TARGET}}/

      - name: Restart
        run: |
          ssh URLATE-PRODUCTION \
            "cd '${{secrets.DEPLOY_TARGET}}' && pm2 startOrReload ecosystem.config.js --update-env"
