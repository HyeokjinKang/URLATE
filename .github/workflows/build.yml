name: Build
permissions:
  contents: read

on:
  pull_request:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        uses: pnpm/setup@v2
        with:
          cache: true
          install: true

      - name: Build project
        run: pnpm run build
